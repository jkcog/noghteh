name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  models: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test > error.log 2>&1 || (cat error.log && exit 1)

      - name: Build Project
        run: npm run build

      - name: AI Auto-Diagnose and PR Fix
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Build or Test failed! Initiating self-healing sequence..."

          node ./scripts/ai-diagnosis.js

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH_NAME="ai-fix-${{ github.run_id }}"
          git checkout -b $BRANCH_NAME

          git add .
          git commit -m "chore: AI automated fixes"
          git push -u origin $BRANCH_NAME

          gh pr create \
            --title "🤖 AI Auto Fix" \
            --body-file pr_body.txt \
            --base main \
            --head $BRANCH_NAME

      - name: Deploy to GitHub Pages
        if: success()
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
